name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check C++ formatting
        run: |
          find include src tests examples benchmarks -type f \( -name '*.hpp' -o -name '*.cpp' \) \
            -exec clang-format --dry-run --Werror {} +

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-python-r
            os: ubuntu-latest
            build_r: "ON"
            install_check: true
          - name: macos-python-r
            os: macos-latest
            build_r: "ON"
            install_check: false
          - name: ubuntu-python-only
            os: ubuntu-latest
            build_r: "OFF"
            install_check: false

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libeigen3-dev

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja eigen

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nanobind numpy pandas pyarrow scikit-build-core

      - name: Set up R
        if: matrix.build_r == 'ON'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install cpp11, nanoarrow, and testthat R packages
        if: matrix.build_r == 'ON'
        run: |
          Rscript -e "r <- getOption('repos'); if (is.null(r) || is.na(r[1]) || identical(unname(r[1]), '@CRAN@')) r <- c(CRAN = 'https://cloud.r-project.org'); install.packages(c('cpp11', 'nanoarrow', 'testthat'), repos = r); ok <- vapply(c('cpp11', 'nanoarrow', 'testthat'), requireNamespace, logical(1), quietly = TRUE); if (!all(ok)) stop('Failed to install R packages: ', paste(names(ok)[!ok], collapse = ', '))"

      - name: Configure CMake (Release)
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYRABIND_BUILD_R=${{ matrix.build_r }} \
            -DPython_EXECUTABLE="${{ steps.setup-python.outputs.python-path }}"

      - name: Build
        run: cmake --build build-ci -j

      - name: Run CTest
        run: ctest --test-dir build-ci --output-on-failure

      - name: Test pyra_stats Python wheel install
        run: |
          mkdir -p "${{ runner.temp }}/pyra_stats_pylib"
          python -m pip install --no-build-isolation --no-deps --target "${{ runner.temp }}/pyra_stats_pylib" ./examples/pyra_stats
          PYTHONPATH="${{ runner.temp }}/pyra_stats_pylib" python -m unittest discover -s examples/pyra_stats/tests -v

      - name: Test pyrastats R CMD INSTALL
        if: matrix.build_r == 'ON'
        run: |
          mkdir -p "${{ runner.temp }}/pyra_stats_rlib"
          R CMD INSTALL --no-multiarch -l "${{ runner.temp }}/pyra_stats_rlib" examples/pyra_stats/rpkg
          Rscript -e ".libPaths(c('${{ runner.temp }}/pyra_stats_rlib', .libPaths())); library(pyrastats); testthat::test_dir('examples/pyra_stats/rpkg/tests/testthat', stop_on_failure = TRUE)"
          rm -f examples/pyra_stats/rpkg/src/*.o examples/pyra_stats/rpkg/src/*.so

      - name: Verify CMake install
        if: matrix.install_check
        run: |
          cmake --install build-ci --prefix /tmp/pyrabind_install_check
          test -f /tmp/pyrabind_install_check/include/pyrabind/pyrabind.hpp
          test -f /tmp/pyrabind_install_check/include/pyrabind/eigen.hpp
          test -f /tmp/pyrabind_install_check/include/pyrabind/arrow.hpp
          test -f /tmp/pyrabind_install_check/include/pyrabind/arrow_abi.hpp
          test -f /tmp/pyrabind_install_check/include/pyrabind/make_iterator.hpp
          test -f /tmp/pyrabind_install_check/include/pyrabind/stl/bind_vector.hpp
          test -f /tmp/pyrabind_install_check/include/pyrabind/stl/bind_map.hpp
          test -f /tmp/pyrabind_install_check/share/pyrabind/pyrabind.R
          test -f /tmp/pyrabind_install_check/share/pyrabind/pyrabind_stubgen.py

  docs-build:
    name: starlight-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "docs/package-lock.json"

      - name: Install documentation dependencies
        working-directory: docs
        run: npm ci

      - name: Build Astro Starlight site
        working-directory: docs
        run: npm run build

  asan-ubsan:
    name: asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure ASan + UBSan
        run: cmake --preset asan-ubsan

      - name: Build ASan + UBSan
        run: cmake --build build-asan -j

      - name: Run CTest under ASan + UBSan
        run: ctest --test-dir build-asan --output-on-failure

  windows-python-msvc:
    name: windows-python-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja --no-progress

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nanobind numpy pandas

      - name: Configure CMake (MSVC Python)
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DPYRABIND_BUILD_R=OFF "-DPython_EXECUTABLE=${{ steps.setup-python.outputs.python-path }}"

      - name: Build
        run: cmake --build build-ci -j

      - name: Run CTest
        run: ctest --test-dir build-ci --output-on-failure

  windows-r-rtools:
    name: windows-r-rtools
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          install-rtools: true

      - name: Install Ninja
        run: choco install ninja --no-progress

      - name: Install cpp11 R package
        run: Rscript -e "install.packages('cpp11', repos = 'https://cloud.r-project.org')"

      - name: Verify Rtools compilers on PATH
        run: |
          gcc --version
          g++ --version

      - name: Configure CMake (Rtools MinGW R)
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DPYRABIND_BUILD_PYTHON=OFF -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build-ci -j

      - name: Run CTest
        run: ctest --test-dir build-ci --output-on-failure
